<!doctype html>
<html lang="cs" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Launchpad GEN3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=Geist+Mono:wght@400&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#workspaceMain">Přeskočit na obsah</a>

    <header class="topbar" role="banner">
      <div class="topbar-inner">
        <div id="spaceSwitcher" class="space-switcher">
          <button
            id="spaceSwitcherButton"
            type="button"
            class="space-switcher-button"
            aria-haspopup="dialog"
            aria-expanded="false"
            aria-controls="spaceSwitcherMenu"
          >
            <span id="currentSpaceLogo" class="space-logo space-logo-personal" aria-hidden="true">
              <!-- iconoir/user -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
                <path d="M5 20V19C5 15.134 8.13401 12 12 12C15.866 12 19 15.134 19 19V20" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 12C14.2091 12 16 10.2091 16 8C16 5.79086 14.2091 4 12 4C9.79086 4 8 5.79086 8 8C8 10.2091 9.79086 12 12 12Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            <span id="currentSpaceLabel" class="space-switcher-label">Osobní</span>
            <!-- iconoir/nav-arrow-down -->
            <svg class="space-switcher-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke-width="1.5" aria-hidden="true">
              <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div id="spaceSwitcherMenu" class="space-switcher-menu" role="dialog" aria-label="Profil a prostory" hidden></div>
        </div>

        <nav class="topbar-actions" aria-label="Akce">
          <span id="personalPrivacyBadge" class="privacy-pill" hidden>
            <!-- iconoir/lock -->
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke-width="1.5" aria-hidden="true">
              <path d="M16 12H17.4C17.7314 12 18 12.2686 18 12.6V19.4C18 19.7314 17.7314 20 17.4 20H6.6C6.26863 20 6 19.7314 6 19.4V12.6C6 12.2686 6.26863 12 6.6 12H8M16 12V8C16 6.66667 15.2 4 12 4C8.8 4 8 6.66667 8 8V12M16 12H8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Soukromé
          </span>
          <div class="notifications-anchor">
            <button
              id="notificationsToggle"
              type="button"
              class="icon-btn topbar-icon-plain"
              title="Notifikace — kdo co změnil a ve kterém modulu"
              aria-label="Notifikace"
              aria-expanded="false"
              aria-controls="notificationsPanel"
            >
              <!-- iconoir/bell -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
                <path d="M18 8.4C18 6.70261 17.3679 5.07475 16.2426 3.87452C15.1174 2.67428 13.5913 2 12 2C10.4087 2 8.88258 2.67428 7.75736 3.87452C6.63214 5.07475 6 6.70261 6 8.4C6 15.8667 3 18 3 18H21C21 18 18 15.8667 18 8.4Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M13.73 21C13.5542 21.3031 13.3019 21.5547 12.9982 21.7295C12.6946 21.9044 12.3504 21.9965 12 21.9965C11.6496 21.9965 11.3054 21.9044 11.0018 21.7295C10.6982 21.5547 10.4458 21.3031 10.27 21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span id="notificationsBadge" class="notifications-badge" aria-hidden="true" hidden></span>
            </button>
            <section id="notificationsPanel" class="notifications-panel" aria-label="Notifikace" hidden>
              <div class="notifications-head">
                <span class="rail-eyebrow">Notifikace</span>
                <button id="notificationsMarkAll" type="button" class="notifications-mark-all">Označit vše jako přečtené</button>
              </div>
              <div class="notifications-filters" role="tablist" aria-label="Filtr notifikací">
                <button id="notificationsFilterAll" type="button" class="notifications-filter is-active" role="tab" aria-selected="true">
                  Vše <span id="notificationsCountAll" class="notifications-filter-count">0</span>
                </button>
                <button id="notificationsFilterUnread" type="button" class="notifications-filter" role="tab" aria-selected="false">
                  Nepřečtené <span id="notificationsCountUnread" class="notifications-filter-count">0</span>
                </button>
              </div>
              <div id="notificationsList" class="notifications-list"></div>
            </section>
          </div>
          <button
            id="drawerToggle"
            type="button"
            class="icon-btn topbar-icon-plain"
            title="Panely — stav prostoru, nejčastější, detail"
            aria-label="Panely"
            aria-expanded="false"
          >
            <!-- iconoir/layout-right -->
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
              <path d="M20.4 3H3.6C3.26863 3 3 3.26863 3 3.6V20.4C3 20.7314 3.26863 21 3.6 21H20.4C20.7314 21 21 20.7314 21 20.4V3.6C21 3.26863 20.7314 3 20.4 3Z" stroke="currentColor" stroke-width="1.5" />
              <path d="M14.25 9.75V21" stroke="currentColor" stroke-width="1.5" />
              <path d="M21 9.75H14.25H3" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span id="spaceHealthBadge" class="space-health-badge" aria-hidden="true" hidden></span>
          </button>
          <details id="topbarOverflow" class="topbar-overflow">
            <summary class="icon-btn topbar-icon-plain topbar-overflow-toggle" title="Další možnosti" aria-label="Další možnosti">
              <!-- iconoir/more-horiz -->
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
                <path d="M20 12.5C20.2761 12.5 20.5 12.2761 20.5 12C20.5 11.7239 20.2761 11.5 20 11.5C19.7239 11.5 19.5 11.7239 19.5 12C19.5 12.2761 19.7239 12.5 20 12.5Z" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M12 12.5C12.2761 12.5 12.5 12.2761 12.5 12C12.5 11.7239 12.2761 11.5 12 11.5C11.7239 11.5 11.5 11.7239 11.5 12C11.5 12.2761 11.7239 12.5 12 12.5Z" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M4 12.5C4.27614 12.5 4.5 12.2761 4.5 12C4.5 11.7239 4.27614 11.5 4 11.5C3.72386 11.5 3.5 11.7239 3.5 12C3.5 12.2761 3.72386 12.5 4 12.5Z" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </summary>
            <div class="topbar-overflow-menu">
              <button
                id="doctorStatus"
                type="button"
                class="icon-btn topbar-icon-plain doctor-status-icon"
                aria-controls="problemsPanel"
                aria-expanded="false"
                aria-label="Doktor: bez výsledku"
                title="Doktor: bez výsledku"
              >
                <!-- lucide/stethoscope -->
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M11 2v2" />
                  <path d="M5 2v2" />
                  <path d="M5 3H4a2 2 0 0 0-2 2v3a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
                  <path d="M8 14a6 6 0 0 0 12 0v-2" />
                  <circle cx="20" cy="10" r="2" />
                </svg>
                <span class="doctor-status-alert" aria-hidden="true" hidden>!</span>
              </button>
              <button
                id="reloadButton"
                type="button"
                class="icon-btn topbar-icon-plain"
                data-overflow-label="Synchronizovat"
                title="Synchronizovat — znovu objevit lokální Organizace a appky"
                aria-label="Synchronizovat"
              >
                <!-- iconoir/refresh -->
                <svg class="refresh-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="1.5" aria-hidden="true">
                  <path d="M21.8883 13.5C21.1645 18.3113 17.013 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C16.1006 2 19.6248 4.46819 21.1679 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                  <path d="M17 8H21.4C21.7314 8 22 7.73137 22 7.4V3" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </details>
        </nav>
      </div>
      <div id="updateBanner" class="update-banner" role="status" hidden>
        <svg class="update-banner-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M4 21h16" />
        </svg>
        <svg class="update-banner-spinner" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3a9 9 0 1 1-6.4 2.6" />
        </svg>
        <span id="updateBannerText" class="update-banner-text"></span>
        <button id="updateBannerAction" type="button" class="update-banner-action"></button>
      </div>
    </header>

    <main class="page">
      <div class="layout">
        <section id="workspaceMain" class="workspace-panel" aria-label="Aplikace">
          <section id="workspaceWelcome" class="workspace-welcome" aria-labelledby="workspaceWelcomeTitle">
            <h1 id="workspaceWelcomeTitle" class="workspace-welcome-title">Vítejte v pracovním prostoru</h1>
          </section>

          <div id="appsToolbar" class="apps-toolbar" aria-label="Filtrování aplikací">
            <label class="search-field">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <span class="sr-only">Hledat aplikaci</span>
              <input id="appsSearch" type="search" autocomplete="off" placeholder="Hledat aplikaci…" />
            </label>
            <div class="filter-controls">
              <div class="segmented-control" role="group" aria-label="Zobrazení aplikací">
                <button type="button" class="segment is-active" data-status-segment="all" aria-pressed="true">Vše</button>
                <button id="attentionToggle" type="button" class="segment attention-toggle" aria-pressed="false">Ke kontrole</button>
              </div>
            </div>
          </div>

          <section id="problemsPanel" class="problems-panel hidden" aria-label="Problémy"></section>
          <section id="actionPanel" class="action-panel hidden" aria-label="Výsledek akce"></section>

          <section id="appsGrid" class="apps-stack" aria-label="Workspace aplikace"></section>

          <details class="debug-table">
            <summary>Debug table</summary>
            <div class="table-shell">
              <table>
                <thead>
                  <tr>
                    <th>Aplikace</th>
                    <th>Organizace</th>
                    <th>Surface</th>
                    <th>Port</th>
                    <th>Health</th>
                    <th>Deps</th>
                    <th>Source</th>
                    <th>Akce</th>
                  </tr>
                </thead>
                <tbody id="appsTable"></tbody>
              </table>
            </div>
          </details>
        </section>

        <aside id="recentChangesSidebar" class="recent-changes-sidebar hidden" aria-label="Poslední změny">
          <section id="hero" class="hero side-panel hero-loading" aria-live="polite" aria-label="Stav prostoru">
            <div class="hero-head">
              <span class="rail-eyebrow">Stav prostoru</span>
              <span class="hero-indicator" aria-hidden="true"></span>
            </div>
            <h2 id="heroTitle" class="hero-title">Načítám stav…</h2>
            <div class="hero-panel">
              <button id="heroCta" type="button" class="btn btn-secondary btn-sm">Zkontrolovat stav</button>
            </div>
          </section>
          <section id="organizationGitPanel" class="side-panel organization-git-panel" aria-label="Git Organizace">
            <div class="side-panel-head organization-git-head">
              <span class="rail-eyebrow">Git Organizace</span>
              <button id="pullAllButton" type="button" class="btn btn-secondary btn-sm">Pullnout vše</button>
            </div>
            <div id="organizationGitStatus" class="organization-git-status"></div>
          </section>
        </aside>

        <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
        <aside class="detail-drawer" id="detailDrawer" role="dialog" aria-label="Panely" aria-hidden="true" aria-modal="false" tabindex="-1" inert>
          <div class="drawer-head">
            <span class="rail-eyebrow">Panely</span>
            <button id="drawerClose" type="button" class="icon-btn" title="Zavřít panely" aria-label="Zavřít panely">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
          <div class="drawer-body">
            <section id="mostUsedPanel" class="side-panel" aria-label="Nejčastější">
              <div class="side-panel-head">
                <span class="rail-eyebrow">Nejčastější</span>
              </div>
              <div id="mostUsed" class="most-used"></div>
            </section>

            <div id="appDetail" class="empty-detail">Vyber aplikaci</div>
          </div>
        </aside>
      </div>
    </main>

    <div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
