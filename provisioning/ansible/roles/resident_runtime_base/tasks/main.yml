---
- name: Load the reviewed Resident dependency pins from source
  ansible.builtin.set_fact:
    lazurio_hermes_pin: "{{ lookup('ansible.builtin.file', lazurio_dependency_pin_root ~ '/hermes.json') | from_json }}"
    lazurio_gbrain_pin: "{{ lookup('ansible.builtin.file', lazurio_dependency_pin_root ~ '/gbrain.json') | from_json }}"
    lazurio_toolchain_pin: "{{ lookup('ansible.builtin.file', lazurio_dependency_pin_root ~ '/toolchain.json') | from_json }}"

- name: Select the exact Linux target
  ansible.builtin.set_fact:
    lazurio_dependency_target: "{{ 'linux-x64' if ansible_facts.architecture == 'x86_64' else 'linux-arm64' }}"

- name: Define the exact dependency checkouts and safe Git invocation
  ansible.builtin.set_fact:
    lazurio_dependency_checkouts:
      - id: hermes
        root: "{{ lazurio_hermes_root }}"
        repository_url: "https://github.com/{{ lazurio_hermes_pin.repository }}.git"
        commit: "{{ lazurio_hermes_pin.commit }}"
        lock_file: "{{ lazurio_hermes_pin.lock_file }}"
        lock_sha256: "{{ lazurio_hermes_pin.lock_sha256 }}"
      - id: gbrain
        root: "{{ lazurio_gbrain_root }}"
        repository_url: "https://github.com/{{ lazurio_gbrain_pin.repository }}.git"
        commit: "{{ lazurio_gbrain_pin.commit }}"
        lock_file: "{{ lazurio_gbrain_pin.lock_file }}"
        lock_sha256: "{{ lazurio_gbrain_pin.lock_sha256 }}"
    lazurio_safe_git_argv_prefix:
      - /usr/bin/env
      - -i
      - PATH=/usr/bin:/bin
      - LC_ALL=C
      - "HOME={{ lazurio_git_home }}"
      - "XDG_CONFIG_HOME={{ lazurio_git_home }}/xdg"
      - GIT_CONFIG_NOSYSTEM=1
      - GIT_CONFIG_GLOBAL=/dev/null
      - GIT_TERMINAL_PROMPT=0
      - GCM_INTERACTIVE=never
      - GIT_ASKPASS=/bin/false
      - SSH_ASKPASS=/bin/false
      - SSH_ASKPASS_REQUIRE=never
      - GIT_SSH=/usr/bin/ssh
      - "{{ lazurio_git_executable }}"
      - -c
      - core.hooksPath=/dev/null
      - -c
      - core.fsmonitor=false
      - -c
      - core.sshCommand=/usr/bin/ssh
      - -c
      - core.gitProxy=
      - -c
      - core.askPass=/bin/false
      - -c
      - credential.helper=
      - -c
      - protocol.ext.allow=never
      - -c
      - protocol.file.allow=never
      - -c
      - submodule.recurse=false
      - -c
      - fetch.recurseSubmodules=false
      - -c
      - maintenance.auto=false
      - -c
      - gc.auto=0
    lazurio_forbidden_checkout_git_config_pattern: >-
      ^(include|includeif)\..*\.path$|^url\..*\.(insteadof|pushinsteadof)$|^http(\..*)?\.proxy$|^credential(\..*)?\.helper$|^remote\..*\.proxy$|^core\.(gitproxy|sshcommand)$|^filter\..*\.(clean|smudge|process)$

- name: Refuse unsupported runtime modes or ambiguous paths
  ansible.builtin.assert:
    that:
      - lazurio_hermes_service_mode in ["upstream", "existing"]
      - lazurio_gbrain_engine in ["pglite", "existing"]
      - lazurio_bun_path is match('^/')
      - lazurio_uv_path is match('^/')
      - lazurio_git_executable == "/usr/bin/git"
      - lazurio_git_home is match('^/')
      - lazurio_hermes_root is match('^/')
      - lazurio_hermes_home is match('^/')
      - lazurio_gbrain_root is match('^/')
      - lazurio_gbrain_home is match('^/')
      - lazurio_hermes_pin.repository == "Lazurio/hermes-agent"
      - lazurio_hermes_pin.release_tag | length > 0
      - lazurio_gbrain_pin.repository == "Lazurio/gbrain"
      - lazurio_gbrain_pin.runtime.transport == "stdio"
    fail_msg: >-
      Runtime materialization supports only the exact reviewed Hermes and GBrain
      forks, PGLite or an explicitly retained existing engine, and absolute paths.

- name: Create dependency, toolchain and runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ lazurio_dependency_cache_root }}"
      owner: root
      group: root
      mode: "0700"
    - path: "{{ lazurio_toolchain_root }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ lazurio_git_home }}"
      owner: root
      group: root
      mode: "0700"
    - path: "{{ lazurio_git_home }}/xdg"
      owner: root
      group: root
      mode: "0700"
    - path: "{{ lazurio_hermes_home }}"
      owner: "{{ lazurio_runtime_user }}"
      group: "{{ lazurio_runtime_user }}"
      mode: "0700"
    - path: "{{ lazurio_gbrain_home }}"
      owner: "{{ lazurio_runtime_user }}"
      group: "{{ lazurio_runtime_user }}"
      mode: "0700"

- name: Download the exact reviewed Resident toolchain archives
  ansible.builtin.get_url:
    url: "{{ item.value.targets[lazurio_dependency_target].archive }}"
    dest: >-
      {{ lazurio_dependency_cache_root }}/{{ item.key }}-{{ item.value.version }}{{ '.zip' if item.key == 'bun' else '.tar.gz' }}
    checksum: "sha256:{{ item.value.targets[lazurio_dependency_target].sha256 }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ lazurio_toolchain_pin.tools | dict2items }}"

- name: Extract the reviewed Resident toolchain archives
  ansible.builtin.unarchive:
    src: >-
      {{ lazurio_dependency_cache_root }}/{{ item.key }}-{{ item.value.version }}{{ '.zip' if item.key == 'bun' else '.tar.gz' }}
    dest: "{{ lazurio_dependency_cache_root }}"
    remote_src: true
    creates: "{{ lazurio_dependency_cache_root }}/{{ item.value.targets[lazurio_dependency_target].binary }}"
  loop: "{{ lazurio_toolchain_pin.tools | dict2items }}"

- name: Install exact Bun and uv binaries into the operator toolchain
  ansible.builtin.copy:
    src: "{{ lazurio_dependency_cache_root }}/{{ item.value.targets[lazurio_dependency_target].binary }}"
    dest: "{{ lazurio_toolchain_root }}/{{ item.key }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop: "{{ lazurio_toolchain_pin.tools | dict2items }}"

- name: Read back exact toolchain versions
  ansible.builtin.command:
    argv:
      - "{{ lazurio_toolchain_root }}/{{ item.key }}"
      - --version
  loop: "{{ lazurio_toolchain_pin.tools | dict2items }}"
  register: lazurio_toolchain_versions
  changed_when: false

- name: Prove exact toolchain versions
  ansible.builtin.assert:
    that:
      - item.item.value.version in item.stdout
    fail_msg: "Installed {{ item.item.key }} does not match the reviewed version pin."
  loop: "{{ lazurio_toolchain_versions.results }}"

- name: Inspect the allowlisted Git executable
  ansible.builtin.stat:
    path: "{{ lazurio_git_executable }}"
    follow: true
    get_checksum: false
  register: lazurio_git_executable_stat

- name: Refuse an untrusted Git executable
  ansible.builtin.assert:
    that:
      - lazurio_git_executable_stat.stat.exists
      - lazurio_git_executable_stat.stat.isreg
      - lazurio_git_executable_stat.stat.executable
      - lazurio_git_executable_stat.stat.uid == 0
      - not lazurio_git_executable_stat.stat.wgrp
      - not lazurio_git_executable_stat.stat.woth
    fail_msg: >-
      Resident dependency materialization requires the root-owned, non-writable
      Debian package Git executable at /usr/bin/git.

- name: Probe the allowlisted Git executable through the safe argv prefix
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['--version'] }}"
  changed_when: false

- name: Inspect dependency checkout roots
  ansible.builtin.stat:
    path: "{{ item.root }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_dependency_root_stats

- name: Refuse non-directory dependency checkout roots
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isdir
    fail_msg: "Dependency root {{ item.item.root }} exists but is not a directory."
  loop: "{{ lazurio_dependency_root_stats.results }}"

- name: Probe existing dependency checkout identities
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.item.root, 'rev-parse', '--is-inside-work-tree'] }}"
  loop: "{{ lazurio_dependency_root_stats.results }}"
  when: item.stat.exists
  register: lazurio_existing_checkout_probes
  changed_when: false
  failed_when: false

- name: Refuse ambiguous existing dependency roots
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - item.stdout == "true"
    fail_msg: >-
      Existing dependency root {{ item.item.item.root }} is not a Git worktree;
      preserve or relocate it before provisioning.
  loop: "{{ lazurio_existing_checkout_probes.results }}"
  when: not (item.skipped | default(false))

- name: Prove existing dependency checkouts are clean before mutation
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.item.root, 'status', '--porcelain=v1', '--untracked-files=all'] }}"
  loop: "{{ lazurio_dependency_root_stats.results }}"
  when: item.stat.exists
  register: lazurio_existing_checkout_statuses
  changed_when: false

- name: Preserve local dependency checkout changes
  ansible.builtin.assert:
    that:
      - item.stdout | length == 0
    fail_msg: >-
      Dependency checkout {{ item.item.item.root }} contains local changes.
      Provisioning will not overwrite or clean them.
  loop: "{{ lazurio_existing_checkout_statuses.results }}"
  when: not (item.skipped | default(false))

- name: Initialize missing dependency worktrees
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['init', '--quiet', item.item.root] }}"
  loop: "{{ lazurio_dependency_root_stats.results }}"
  when: not item.stat.exists
  changed_when: true

- name: Read checkout-local Git configuration without following includes
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.root, 'config', '--local', '--no-includes', '--name-only', '--list'] }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_checkout_git_configs
  changed_when: false

- name: Refuse checkout-local execution or transport overrides
  ansible.builtin.assert:
    that:
      - >-
        item.stdout_lines
        | map('lower')
        | select('match', lazurio_forbidden_checkout_git_config_pattern)
        | list
        | length == 0
    fail_msg: >-
      Dependency checkout {{ item.item.root }} contains local Git execution or
      transport overrides. Remove the override before provisioning; it will not
      be executed or silently replaced.
  loop: "{{ lazurio_checkout_git_configs.results }}"

- name: Record the reviewed dependency origin without trusting it for transport
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.root, 'config', '--local', '--replace-all', 'remote.origin.url', item.repository_url] }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  changed_when: false

- name: Read dependency commits before update
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.root, 'rev-parse', '--verify', 'HEAD'] }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_dependency_commits_before
  changed_when: false
  failed_when: lazurio_dependency_commits_before.rc not in [0, 128]

- name: Fetch only the missing exact dependency commits
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.item.root, 'fetch', '--depth', '1', '--no-tags', '--no-recurse-submodules', item.item.repository_url, item.item.commit] }}"
  loop: "{{ lazurio_dependency_commits_before.results }}"
  when: item.rc != 0 or item.stdout != item.item.commit
  changed_when: true

- name: Check out only the missing exact dependency commits
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.item.root, 'checkout', '--no-recurse-submodules', '--detach', item.item.commit] }}"
  loop: "{{ lazurio_dependency_commits_before.results }}"
  when: item.rc != 0 or item.stdout != item.item.commit
  changed_when: true

- name: Read back exact dependency commits
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.root, 'rev-parse', '--verify', 'HEAD'] }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_dependency_commits_after
  changed_when: false

- name: Read back exact dependency lock digests
  ansible.builtin.stat:
    path: "{{ item.root }}/{{ item.lock_file }}"
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_dependency_lock_stats

- name: Read back final dependency checkout status
  ansible.builtin.command:
    argv: "{{ lazurio_safe_git_argv_prefix + ['-C', item.root, 'status', '--porcelain=v1', '--untracked-files=all'] }}"
  loop: "{{ lazurio_dependency_checkouts }}"
  register: lazurio_dependency_statuses_after
  changed_when: false

- name: Prove exact clean dependency materialization
  ansible.builtin.assert:
    that:
      - lazurio_dependency_commits_after.results[item].stdout == lazurio_dependency_checkouts[item].commit
      - lazurio_dependency_lock_stats.results[item].stat.exists
      - lazurio_dependency_lock_stats.results[item].stat.isreg
      - lazurio_dependency_lock_stats.results[item].stat.checksum | default('') == lazurio_dependency_checkouts[item].lock_sha256
      - lazurio_dependency_statuses_after.results[item].stdout | length == 0
    fail_msg: "Dependency {{ lazurio_dependency_checkouts[item].id }} does not match its reviewed commit and lock digest."
  loop: "{{ range(0, lazurio_dependency_checkouts | length) | list }}"

- name: Install the Hermes Python runtime selected by the exact uv toolchain
  ansible.builtin.command:
    argv:
      - "{{ lazurio_uv_path }}"
      - python
      - install
      - "3.11"
  environment:
    UV_NO_CONFIG: "1"
    UV_PYTHON_INSTALL_DIR: "{{ lazurio_runtime_root }}/python"
  register: lazurio_python_install
  changed_when: "'Installed Python' in lazurio_python_install.stderr"

- name: Inspect the Hermes virtual environment
  ansible.builtin.stat:
    path: "{{ lazurio_hermes_root }}/venv/bin/python"
  register: lazurio_hermes_venv

- name: Create the Hermes virtual environment once
  ansible.builtin.command:
    argv:
      - "{{ lazurio_uv_path }}"
      - venv
      - "{{ lazurio_hermes_root }}/venv"
      - --python
      - "3.11"
  environment:
    UV_NO_CONFIG: "1"
    UV_PYTHON_INSTALL_DIR: "{{ lazurio_runtime_root }}/python"
  when: not lazurio_hermes_venv.stat.exists

- name: Synchronize Hermes from its reviewed lock
  ansible.builtin.command:
    argv:
      - "{{ lazurio_uv_path }}"
      - sync
      - --extra
      - all
      - --locked
  args:
    chdir: "{{ lazurio_hermes_root }}"
  environment:
    UV_NO_CONFIG: "1"
    UV_PROJECT_ENVIRONMENT: "{{ lazurio_hermes_root }}/venv"
    UV_PYTHON: "{{ lazurio_hermes_root }}/venv/bin/python"
  register: lazurio_hermes_sync
  changed_when: "'Installed ' in lazurio_hermes_sync.stderr or 'Prepared ' in lazurio_hermes_sync.stderr"

- name: Keep the uv environment marker operator-owned
  ansible.builtin.file:
    path: "{{ lazurio_hermes_root }}/venv/.lock"
    state: file
    owner: root
    group: root
    mode: "0644"

- name: Materialize GBrain dependencies without running repository postinstall hooks
  ansible.builtin.command:
    argv:
      - "{{ lazurio_bun_path }}"
      - install
      - --frozen-lockfile
      - --ignore-scripts
  args:
    chdir: "{{ lazurio_gbrain_root }}"
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
  register: lazurio_gbrain_install
  changed_when: "'packages installed' in lazurio_gbrain_install.stdout"

- name: Inspect the local PGLite engine
  ansible.builtin.stat:
    path: "{{ lazurio_gbrain_home }}/.gbrain/brain.pglite/PG_VERSION"
  register: lazurio_gbrain_pglite
  when: lazurio_gbrain_engine == "pglite"

- name: Initialize the personal GBrain with its supported PGLite seam
  ansible.builtin.command:
    argv:
      - "{{ lazurio_bun_path }}"
      - run
      - "{{ lazurio_gbrain_root }}/src/cli.ts"
      - init
      - --pglite
      - --no-embedding
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
    GBRAIN_HOME: "{{ lazurio_gbrain_home }}"
  become: true
  become_user: "{{ lazurio_runtime_user }}"
  when:
    - lazurio_gbrain_engine == "pglite"
    - not lazurio_gbrain_pglite.stat.exists

- name: Verify GBrain through its own Doctor
  ansible.builtin.command:
    argv:
      - "{{ lazurio_bun_path }}"
      - run
      - "{{ lazurio_gbrain_root }}/src/cli.ts"
      - doctor
      - --json
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
    GBRAIN_HOME: "{{ lazurio_gbrain_home }}"
  become: true
  become_user: "{{ lazurio_runtime_user }}"
  changed_when: false

- name: Inspect the private Hermes gateway EnvironmentFile
  ansible.builtin.stat:
    path: "{{ lazurio_hermes_environment_file }}"
  register: lazurio_hermes_environment

- name: Refuse to install a gateway without private runtime credentials
  ansible.builtin.assert:
    that:
      - lazurio_hermes_environment.stat.exists
      - lazurio_hermes_environment.stat.isreg
      - lazurio_hermes_environment.stat.size > 0
    fail_msg: >-
      Populate the private Hermes gateway EnvironmentFile before runtime
      activation. Credentials never belong in inventory or the Resident artifact.

- name: Prove the private Hermes API and bridge credential seam without printing values
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |-
        import pathlib, sys
        def read_env(path):
          result = {}
          for raw in pathlib.Path(path).read_text(encoding="utf-8").splitlines():
            line = raw.strip()
            if not line or line.startswith("#") or "=" not in line:
              continue
            key, value = line.removeprefix("export ").split("=", 1)
            result[key.strip()] = value.strip().strip("'\"")
          return result
        hermes = read_env(sys.argv[1])
        bridge = read_env(sys.argv[2])
        enabled = hermes.get("API_SERVER_ENABLED", "").lower() in {"1", "true", "yes", "on"}
        hermes_key = hermes.get("API_SERVER_KEY", "")
        bridge_key = next((bridge.get(key, "") for key in ("AGENT_RUNTIME_KEY", "API_SERVER_KEY", "HERMES_API_KEY") if bridge.get(key, "")), "")
        if not enabled or not hermes_key or hermes_key != bridge_key:
          print("Hermes API must be enabled and use the same non-empty private key as the Buddy bridge", file=sys.stderr)
          raise SystemExit(1)
      - "{{ lazurio_hermes_environment_file }}"
      - "{{ lazurio_bridge_environment_file }}"
  changed_when: false

- name: Grant only the runtime group read access to the Hermes custody file
  ansible.builtin.file:
    path: "{{ lazurio_hermes_environment_file }}"
    state: file
    owner: root
    group: "{{ lazurio_runtime_user }}"
    mode: "0640"
  when: lazurio_hermes_service_mode == "upstream"

- name: Point Hermes at its root-custodied private environment
  ansible.builtin.file:
    src: "{{ lazurio_hermes_environment_file }}"
    dest: "{{ lazurio_hermes_home }}/.env"
    state: link
    force: false
    follow: false
  when: lazurio_hermes_service_mode == "upstream"

- name: Read configured Hermes MCP servers
  ansible.builtin.command:
    argv:
      - "{{ lazurio_hermes_root }}/venv/bin/hermes"
      - mcp
      - list
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
    HERMES_HOME: "{{ lazurio_hermes_home }}"
  become: true
  become_user: "{{ lazurio_runtime_user }}"
  register: lazurio_hermes_mcp_list
  changed_when: false

- name: Register the exact local GBrain stdio MCP through Hermes
  ansible.builtin.command:
    argv:
      - "{{ lazurio_hermes_root }}/venv/bin/hermes"
      - mcp
      - add
      - gbrain
      - --command
      - "{{ lazurio_bun_path }}"
      - --env
      - "HOME=/var/lib/{{ lazurio_runtime_user }}"
      - "GBRAIN_HOME={{ lazurio_gbrain_home }}"
      - --args
      - run
      - "{{ lazurio_gbrain_root }}/src/cli.ts"
      - serve
    stdin: "\n"
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
    HERMES_HOME: "{{ lazurio_hermes_home }}"
  become: true
  become_user: "{{ lazurio_runtime_user }}"
  when: "'gbrain' not in lazurio_hermes_mcp_list.stdout"

- name: Inspect the Hermes gateway service before upstream converge
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-gateway.service
  register: lazurio_hermes_service_before

- name: Install the upstream Hermes gateway service without starting it
  ansible.builtin.command:
    argv:
      - "{{ lazurio_hermes_root }}/venv/bin/hermes"
      - gateway
      - install
      - --system
      - --run-as-user
      - "{{ lazurio_runtime_user }}"
      - --no-start-now
      - --start-on-login
  environment:
    HOME: "/var/lib/{{ lazurio_runtime_user }}"
    HERMES_HOME: "{{ lazurio_hermes_home }}"
  register: lazurio_hermes_service_install
  changed_when: false
  when:
    - lazurio_hermes_service_mode == "upstream"
    - not ansible_check_mode

- name: Inspect the Hermes gateway service baseline
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-gateway.service
  register: lazurio_hermes_service

- name: Report an actual upstream Hermes service change
  ansible.builtin.set_fact:
    lazurio_hermes_service_changed: true
  changed_when: >-
    not lazurio_hermes_service_before.stat.exists or
    lazurio_hermes_service_before.stat.checksum != lazurio_hermes_service.stat.checksum
  when: lazurio_hermes_service_mode == "upstream"

- name: Require the gateway service before Resident activation
  ansible.builtin.assert:
    that:
      - lazurio_hermes_service.stat.exists
      - lazurio_hermes_service.stat.isreg
    fail_msg: >-
      The Hermes gateway service baseline is absent. Use upstream mode for a
      greenfield host or retain an explicitly verified existing service.
